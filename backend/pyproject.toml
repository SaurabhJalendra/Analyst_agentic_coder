[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM", "PL"]
ignore = ["S101", "PLR0913"]  # allow assert in tests; allow >5 args (FastAPI deps)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "PLR2004"]  # allow hardcoded test secrets; allow magic numbers in assertions

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
