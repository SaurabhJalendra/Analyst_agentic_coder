version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analyst-coder-backend
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_ACCESS_TOKEN=${CLAUDE_CODE_ACCESS_TOKEN}
      - CLAUDE_CODE_REFRESH_TOKEN=${CLAUDE_CODE_REFRESH_TOKEN}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
      - DEFAULT_REPO_URL=${DEFAULT_REPO_URL}
      - DEFAULT_REPO_BRANCH=${DEFAULT_REPO_BRANCH:-main}
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKSPACE_BASE_DIR=/app/workspaces
      - MAX_CONTEXT_LENGTH=${MAX_CONTEXT_LENGTH:-200000}
    volumes:
      # Persist workspaces between restarts
      - workspaces_data:/app/workspaces
      # Persist SQLite database
      - db_data:/app/data
      # Claude Code config (for authentication)
      - claude_config:/home/appuser/.claude
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold-start budget: claude CLI auth + DB init + workspace cleanup can
      # take 30-60s on a fresh container. 90s gives margin without delaying
      # restarts of an already-warm container (which return /health in <1s).
      start_period: 90s
    stop_grace_period: 30s
    networks:
      - analyst-coder-network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: analyst-coder-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - analyst-coder-network

volumes:
  workspaces_data:
    driver: local
  db_data:
    driver: local
  claude_config:
    driver: local

networks:
  analyst-coder-network:
    driver: bridge
